baseURL = "https://blog.pgxn.org"
locale = 'en-us'
defaultContentLanguage = "en-us"
title = "⚙️ PGXN Blog"
enableGitInfo = true

[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome/v2"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
	[markup.tableOfContents]
		startLevel = 2 # ToC starts from H2
		endLevel = 4 # ToC ends at H4
		ordered = false # generates <ul> instead of <ol>

[outputs]
  home = [ "HTML", "RSS" ] # Generate RSS

[permalinks]
posts = "/:year/:month/:slug/"

[menu]
  [[menu.main]]
    pageRef="posts"
    name = 'PGXN'
    url = 'https://pgxn.org'
    weight = 10
  [[menu.main]]
    pageRef="tags"
    name = 'Tags'
    url = '/tags/'
    weight = 20

[params]
  sitename = "⚙️ PGXN Blog"
  defaultColor = "auto"
  goToTop = true
  mainSections = ['posts']

[params.author]
  avatar = "gear.svg"
  intro = "The PGXN BLog"
  name = "The PGXN Blog"
  description = "Updates from the PostgreSQL Extension Network"

[[params.socialIcons]]
name = "github"
url = "https://github.com/pgxn"

[[params.socialIcons]]
name = "mastodon"
url = "https://mastodon.social/@pgxn"

[[params.socialIcons]]
name = "RSS"
url = "/index.xml"

[markup.goldmark.renderHooks.image]
useEmbedded = "fallback"

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

[markup.goldmark.parser.attribute]
  block = true

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
